[project]
name = "exhibit"
version = "0.1.0"
description = "Role-aware log intelligence on SereneDB — National AI Hackathon 2026, team Logging off Early"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
exhibit-mcp = "exhibit.server:main"
exhibit-check = "exhibit.checks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exhibit"]
